import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {

	id 'maven-publish'
	id 'fabric-loom' version "$loom_version"
  	id "org.jetbrains.kotlin.jvm" version "2.2.0"

}

def archivesBaseName = project.archives_base_name
def mavenGroup = project.maven_group

def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def yarnMappings = project.yarn_mappings
def modVersion = project.mod_version

def fabricVersion = project.fabric_version
def fabricKotlinVersion = project.fabric_kotlin_version

version = "mc$minecraftVersion-v$modVersion"
group = mavenGroup

base { archivesName = archivesBaseName }

loom {

	splitEnvironmentSourceSets()

	mods {
		"harmony" { sourceSet sourceSets.main;          sourceSet sourceSets.client }
	}

}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:$minecraftVersion"
	mappings "net.fabricmc:yarn:$yarnMappings:v2"
	modImplementation "net.fabricmc:fabric-loader:$loaderVersion"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:$fabricVersion"
	modImplementation "net.fabricmc:fabric-language-kotlin:$fabricKotlinVersion"

}

processResources {

	inputs.property "version", version

	filesMatching("fabric.mod.json") {

        expand(
                "version": version,

                "minecraft_version": minecraftVersion,

                "fabric_loader": loaderVersion,
                "fabric_kotlin_version": fabricKotlinVersion
        )

    }

}

tasks.withType( JavaCompile ).configureEach { it.options.release = 17 }

tasks.withType( KotlinCompile ).configureEach {
    compilerOptions {
        jvmTarget.set( JvmTarget.JVM_17 )
    }
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}" }
    }
}

// configure the maven publication
publishing {

	publications {

		create( "mavenJava", MavenPublication ) {
			artifactId = archivesBaseName;		from components.java
		}

	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}

}